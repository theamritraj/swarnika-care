server:
  port: 8081

spring:

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  application:
    name: iam-service
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5000ms
  datasource:
    url: jdbc:mysql://localhost:3306/swarnika_care?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: swarnika
    password: Swarnika@2026
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USER}
    password: ${EMAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 1 day

otp:
  expiration-minutes: 5
  max-attempts: 3
  resend-cooldown-seconds: 60
  dev-bypass: false

bootstrap:
  admin:
    email: admin@swarnikacare.com

internal:
  api:
    secret: InternalSecret12345!

springdoc:
  swagger-ui:
    path: /

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

app:
  security:
    enabled: true
