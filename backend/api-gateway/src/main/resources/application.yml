server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5000ms
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
      routes:
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/v1/patients, /api/v1/patients/**, /api/patients/**
        - id: doctor-service
          uri: lb://doctor-service
          predicates:
            - Path=/api/v1/doctors, /api/v1/doctors/**, /api/doctors/**, /api/v1/public/doctors/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/appointments, /api/v1/appointments/**, /api/appointments/**
        - id: iam-service
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
        - id: organization-service
          uri: lb://organization-service
          predicates:
            - Path=/api/v1/hospitals, /api/v1/hospitals/**, /api/v1/departments, /api/v1/departments/**, /api/v1/employees/**, /api/v1/positions/**, /api/v1/designations/**, /api/v1/buildings/**, /api/v1/floors/**, /api/v1/units/**, /api/v1/rooms/**, /api/v1/beds/**, /api/v1/nursing-stations/**, /api/v1/public/hospitals/**
        - id: encounter-service
          uri: lb://encounter-service
          predicates:
            - Path=/api/v1/encounters, /api/v1/encounters/**, /api/v1/opd/**, /api/v1/emergency/**, /api/v1/admissions, /api/v1/admissions/**, /api/v1/referrals, /api/v1/referrals/**, /api/v1/queue-tokens, /api/v1/queue-tokens/**, /api/v1/audit-logs, /api/v1/audit-logs/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications, /api/v1/notifications/**
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/v1/billing, /api/v1/billing/**
        - id: nursing-service
          uri: lb://nursing-service
          predicates:
            - Path=/api/v1/nursing, /api/v1/nursing/**
        - id: lab-service
          uri: lb://lab-service
          predicates:
            - Path=/api/v1/lab, /api/v1/lab/**
        - id: document-redeem
          uri: lb://patient-service
          predicates:
            - Path=/api/v1/documents/redeem
        - id: pharmacy-service
          uri: lb://pharmacy-service
          predicates:
            - Path=/api/v1/pharmacy, /api/v1/pharmacy/**
        - id: ipd-service
          uri: lb://ipd-service
          predicates:
            - Path=/api/v1/ipd, /api/v1/ipd/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

springdoc:
  swagger-ui:
    path: /

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

app:
  security:
    enabled: true
