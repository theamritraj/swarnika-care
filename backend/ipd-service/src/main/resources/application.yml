server:
  port: 8092
spring:
  application:
    name: ipd-service
  datasource:
    url: jdbc:mysql://localhost:3306/ipd_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: swarnika
    password: Swarnika@2026
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
